<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pegue um Monstro</title>
<meta name="description" content="Capture, evolua e batalhe em tempo real. Jogue Pegue um Monstro no Roblox.">
<meta property="og:title" content="Pegue um Monstro">
<meta property="og:description" content="Capture, evolua e batalhe em tempo real no Roblox.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: tela única de lançamento. Hero com botão grande, depois o corredor de biomas como faixa de 7 cores, que é a assinatura visual do jogo. Tema escuro assumido de propósito (noite). */
:root{
  --bg:#0f1230;
  --bg2:#171b45;
  --card:#1d2257;
  --line:#2e357a;
  --fg:#f4f6ff;
  --muted:#aab2e6;
  --cta:#ffc533;
  --cta-ink:#2a1a00;
  --pink:#ff6b9d;
  --f-floresta:#3f9b4f;--f-deserto:#e0b25a;--f-neve:#cfe6f2;--f-vulcao:#d4451f;--f-mar:#1e7fc4;--f-espaco:#5a3fb5;--f-caverna:#7a6552;
  --display:'Lilita One','Arial Rounded MT Bold',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 110px;overflow-x:hidden;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 18%,#fff9 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 78% 12%,#fff8 50%,transparent 51%),
    radial-gradient(1px 1px at 44% 30%,#fff7 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 90% 40%,#fff7 50%,transparent 51%),
    radial-gradient(1px 1px at 25% 55%,#fff6 50%,transparent 51%),
    radial-gradient(ellipse at 70% 0%,#2b2f8f55,transparent 60%);
  background-repeat:no-repeat;
}
.wrap{max-width:1040px;margin:0 auto}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
p{margin:0}

/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:32px;align-items:center;padding-block:48px 36px}
.eyebrow{display:inline-block;font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--cta);margin-bottom:14px}
.hero h1{font-size:clamp(46px,9vw,92px);line-height:.95;text-shadow:0 4px 0 #0007}
.hero h1 span{color:var(--cta)}
.lead{font-size:clamp(18px,2.4vw,22px);color:var(--muted);margin:18px 0 26px;max-width:34ch}
.play{
  display:inline-flex;align-items:center;gap:12px;background:var(--cta);color:var(--cta-ink);
  font-family:var(--display);font-size:clamp(24px,5vw,32px);text-decoration:none;
  padding:16px 34px;border-radius:18px;box-shadow:0 6px 0 #b8860b,0 14px 30px #ffc53340;
  transition:transform .12s ease,box-shadow .12s ease;
}
.play:hover{transform:translateY(-2px);box-shadow:0 8px 0 #b8860b,0 18px 36px #ffc53355}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 #b8860b}
.play:focus-visible{outline:3px solid #fff;outline-offset:4px}
.play svg{width:.9em;height:.9em;flex:none}
.note{font-size:14px;color:var(--muted);margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;padding:0;list-style:none}
.chips li{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px}
.chips b{color:var(--cta)}

.cube-stage{position:relative;display:grid;place-items:center;aspect-ratio:1;max-width:380px;width:100%;margin-inline:auto}
.cube-stage::before{content:"";position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle,#ff6b9d55,#5a3fb544 55%,transparent 72%);filter:blur(6px)}
.cube-stage svg{position:relative;width:78%;animation:float 4.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px) rotate(2deg)}}

/* sections */
section{padding-block:40px}
.kicker{font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--pink);margin-bottom:8px}
h2{font-size:clamp(30px,5vw,46px);line-height:1.05;margin-bottom:10px}
.sub{color:var(--muted);max-width:56ch;margin-bottom:26px}

.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:0;margin:0;list-style:none;counter-reset:s}
.steps li{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;counter-increment:s;min-width:0}
.steps li::before{content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--cta);color:var(--cta-ink);font-family:var(--display);font-size:20px;margin-bottom:12px}
.steps h3{font-size:22px;margin-bottom:4px}
.steps p{font-size:15px;color:var(--muted)}
kbd{font-family:var(--body);font-weight:800;background:#0006;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:0 7px;font-size:.9em}

/* corredor */
.corridor{display:grid;grid-template-columns:repeat(7,1fr);border-radius:20px;overflow:hidden;border:2px solid var(--line)}
.biome{min-width:0;padding:44px 8px 12px;text-align:center;font-family:var(--display);font-size:clamp(13px,1.9vw,19px);color:#fff;text-shadow:0 2px 0 #0006;position:relative}
.biome::before{content:"";position:absolute;left:0;right:0;top:0;height:46px;background:linear-gradient(#ffffff26,transparent)}
.b1{background:var(--f-floresta)}.b2{background:var(--f-deserto);color:#3a2a00;text-shadow:none}
.b3{background:var(--f-neve);color:#17384a;text-shadow:none}.b4{background:var(--f-vulcao)}
.b5{background:var(--f-mar)}.b6{background:var(--f-espaco)}.b7{background:var(--f-caverna)}
.shuffle{margin-top:14px;font-weight:700;display:flex;gap:10px;align-items:center;color:var(--muted)}
.shuffle i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--cta);box-shadow:0 0 0 5px #ffc53333}

/* raridade */
.rar{display:flex;flex-wrap:wrap;gap:10px;padding:0;margin:0 0 24px;list-style:none}
.rar li{border-radius:12px;padding:8px 14px;font-weight:800;border:1px solid var(--line);background:var(--card)}
.rar li small{display:block;font-weight:700;color:var(--muted);font-size:12px}
.r-leg{border-color:#ffc533}.r-anime{border-color:var(--pink)}
.auras{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.aura{border-radius:18px;padding:18px;border:1px solid var(--line);background:var(--card);min-width:0}
.aura h3{font-size:24px}
.aura p{font-size:15px;color:var(--muted)}
.a-prata h3{color:#dfe6f2}.a-dourada h3{color:var(--cta)}.a-67 h3{color:var(--pink)}

/* modos */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mode{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}
.mode h3{font-size:24px;margin-bottom:6px}
.mode p{color:var(--muted);font-size:15px}
.mode.big{background:linear-gradient(160deg,#2a2f86,#1d2257);border-color:#4a52c4}
.more{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;padding:0;list-style:none}
.more li{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px}

.final{text-align:center;padding-block:56px 24px}
.final h2{font-size:clamp(34px,7vw,60px)}
.final .sub{margin-inline:auto}
footer{text-align:center;color:var(--muted);font-size:13px;padding-block:20px 8px}

/* barra fixa no celular */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;
  padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(transparent,#0f1230 38%)}
.bar .play{display:flex;justify-content:center;width:100%;font-size:26px;padding:14px 20px}

@media (max-width:860px){
  .hero{grid-template-columns:1fr;padding-block:36px 28px}
  .cube-stage{order:-1;max-width:230px}
  .steps{grid-template-columns:repeat(2,1fr)}
  .auras,.modes{grid-template-columns:1fr}
  .bar{display:block}
}
@media (max-width:520px){
  .corridor{grid-template-columns:1fr}
  .biome{padding:22px 12px 12px;font-size:22px}.biome::before{height:100%;background:linear-gradient(90deg,#ffffff1f,transparent 60%)}
  .steps{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.cube-stage svg{animation:none}html{scroll-behavior:auto}}
</style>


</head>
<body>

</body>
